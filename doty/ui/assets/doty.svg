<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Doty's mark: a broadcast panel tile (cut top-right corner, cyan edge) holding a leaning D whose
       stem is the cyan slash from the DOTY wordmark. Original artwork; no Valve art. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17212c"/>
      <stop offset="1" stop-color="#06080b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe6ff"/>
      <stop offset="0.45" stop-color="#3fd4ff"/>
      <stop offset="1" stop-color="#22a9d6"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d3dd"/>
    </linearGradient>
  </defs>
  <path d="M16 16 H384 L496 128 V496 H16 Z" fill="url(#tile)"/>
  <path d="M22 22 H381.5 L490 130.5 V490 H22 Z" fill="none" stroke="#3fd4ff" stroke-opacity="0.45" stroke-width="12"/>
  <path d="M350 16 H384 L496 128 V162 Z" fill="#3fd4ff"/>
  <g transform="translate(256 256) skewX(-10) translate(-256 -256)">
    <rect x="117" y="106" width="80" height="300" fill="url(#cyan)"/>
    <!-- The bowl as one outline (outer edge, then the inner edge back): the hole's left side is open, so no
         edge is drawn twice at x=223, which left a hairline seam beside the stem. -->
    <path fill="url(#white)"
          d="M223 106 H283 A110 110 0 0 1 393 216 V296 A110 110 0 0 1 283 406 H223 V342 H277
             A46 46 0 0 0 323 296 V216 A46 46 0 0 0 277 170 H223 Z"/>
  </g>
</svg>
